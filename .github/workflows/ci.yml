name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Replaces the former separate test/lint jobs — both folded into the
  # shared NovaVey/.github reusable workflow's own single `npm run verify`
  # (typecheck && build && test && lint && format:check), which this repo
  # already had as one script. Matches Relationship-Based-Authorization's
  # own adoption of this workflow (its ci.yml's D-189 comment) and
  # Taint-Tracked-Tool-Broker's own most recent migration to it.
  #
  # `node-versions` left at the reusable workflow's own default (["24",
  # "26"]) rather than pinned — this is the CI matrix change that would
  # otherwise have meant bumping actions/checkout and actions/setup-node
  # ourselves: those pins now live inside node-verify.yml (currently @v5),
  # not here, so this repo's own already-newer @v7 pins on the jobs below
  # are left alone rather than force-downgraded to match.
  #
  # `pre-verify` stands up the same real `postgres:16` this job's own
  # `services:` block used to (npm test needs a live DATABASE_URL — see
  # CONTRIBUTING.md's "don't mock pg in a new test") — node-verify.yml's
  # own job has no `services:` hook to add one to, so this starts the
  # container by hand, waits for it, and loads the schema (`npm run
  # migrate`, itself runnable via tsx straight off source — no build
  # required first), the same sequence the jobs this replaces ran as
  # separate steps. `DATABASE_URL` is written to $GITHUB_ENV so it's also
  # set for the later `Verify` step in this same job, not just this one.
  verify:
    uses: NovaVey/.github/.github/workflows/node-verify.yml@main
    with:
      pre-verify: |
        docker run -d --name pg-ci -p 5432:5432 \
          -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=devpass -e POSTGRES_DB=principalgraph \
          postgres:16
        for i in $(seq 1 30); do
          docker exec pg-ci pg_isready -U postgres && break
          sleep 1
        done
        echo "DATABASE_URL=postgresql://postgres:devpass@localhost:5432/principalgraph" >> "$GITHUB_ENV"
        DATABASE_URL="postgresql://postgres:devpass@localhost:5432/principalgraph" npm run migrate

  docker:
    # Builds the real Dockerfile/docker-compose.yml this repo ships (see
    # README's Quick Start) and smoke-tests the actual compiled image —
    # not just that `npm run build` succeeds (the `verify` job above
    # already proves that), but that the image built FROM that output
    # actually serves the report and runs `npm run sync`'s own
    # equivalent. Runner-provided Docker (unlike some sandboxed dev
    # environments) has ordinary internet access to pull node:24-alpine
    # and postgres:16, so this is real, not simulated.
    runs-on: ubuntu-latest
    env:
      # docker-compose.yml's `app` service requires this (see its own
      # `:?` guard) — `docker compose` validates variable interpolation
      # for the WHOLE file before running any command, even one that
      # only ever targets a different service (`postgres`, `migrate`),
      # so this has to be set for every step in this job that invokes
      # `docker compose` at all, not just the one that starts `app`.
      # Caught live: the very first `docker compose up -d postgres` call
      # failed on this before it was job-level.
      PRINCIPAL_GRAPH_REPORT_API_KEY: ci-smoke-test-key
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t principal-graph:ci .
      - name: Bring up postgres, then migrate
        run: |
          docker compose up -d postgres
          docker compose run --rm migrate
      - name: Start the report server and confirm it actually serves
        run: |
          docker compose up -d app
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done
          curl -sf http://localhost:8080/health
          curl -sf -H "Authorization: Bearer $PRINCIPAL_GRAPH_REPORT_API_KEY" http://localhost:8080/report | head -5
      - name: npm run sync equivalent — nothing configured but mcp-config, must still exit 0
        run: docker compose run --rm sync
      - name: npm run doctor equivalent — must exit 0 against a freshly migrated database
        run: docker compose run --rm doctor
      - name: Tear down
        if: always()
        run: docker compose down -v

  secrets:
    # Adapters routinely handle a GitHub PAT, AWS credentials, and a Google
    # service-account key read straight off disk (see README's Usage
    # sections) — scan every push/PR for one of those accidentally landing
    # in the repo itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
