name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: principalgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        # Lower bound (package.json engines.node), the previous LTS, and
        # current — catches a regression against the floor we actually
        # advertise, not just whatever happens to be newest.
        node-version: [20, 22, 24]
    env:
      DATABASE_URL: postgresql://postgres:devpass@localhost:5432/principalgraph
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Also exercises scripts/run-migrations.ts itself against a genuinely
      # fresh database on every run — real coverage of the bootstrap path,
      # not just a convenience over the three `psql -f` calls this replaced.
      - name: Load schema
        run: npm run migrate
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  docker:
    # Builds the real Dockerfile/docker-compose.yml this repo ships (see
    # README's Quick Start) and smoke-tests the actual compiled image —
    # not just that `npm run build` succeeds (the `test` job above
    # already proves that), but that the image built FROM that output
    # actually serves the report and runs `npm run sync`'s own
    # equivalent. Runner-provided Docker (unlike some sandboxed dev
    # environments) has ordinary internet access to pull node:20-alpine
    # and postgres:16, so this is real, not simulated.
    runs-on: ubuntu-latest
    env:
      # docker-compose.yml's `app` service requires this (see its own
      # `:?` guard) — `docker compose` validates variable interpolation
      # for the WHOLE file before running any command, even one that
      # only ever targets a different service (`postgres`, `migrate`),
      # so this has to be set for every step in this job that invokes
      # `docker compose` at all, not just the one that starts `app`.
      # Caught live: the very first `docker compose up -d postgres` call
      # failed on this before it was job-level.
      PRINCIPAL_GRAPH_REPORT_API_KEY: ci-smoke-test-key
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t principal-graph:ci .
      - name: Bring up postgres, then migrate
        run: |
          docker compose up -d postgres
          docker compose run --rm migrate
      - name: Start the report server and confirm it actually serves
        run: |
          docker compose up -d app
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done
          curl -sf http://localhost:8080/health
          curl -sf -H "Authorization: Bearer $PRINCIPAL_GRAPH_REPORT_API_KEY" http://localhost:8080/report | head -5
      - name: npm run sync equivalent — nothing configured but mcp-config, must still exit 0
        run: docker compose run --rm sync
      - name: npm run doctor equivalent — must exit 0 against a freshly migrated database
        run: docker compose run --rm doctor
      - name: Tear down
        if: always()
        run: docker compose down -v

  secrets:
    # Adapters routinely handle a GitHub PAT, AWS credentials, and a Google
    # service-account key read straight off disk (see README's Usage
    # sections) — scan every push/PR for one of those accidentally landing
    # in the repo itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
